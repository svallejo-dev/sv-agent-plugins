name: validar

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Manifiestos al día con catalogo.json
        run: python3 tools/build_manifests.py --check

      - name: Skills conformes al estándar Agent Skills
        run: |
          pip install skills-ref
          for d in plugins/*/skills/*/; do agentskills validate "$d"; done

      - name: Tests de los scripts (qa-core y capacity-estimation)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          python3 -m unittest discover -s plugins/qa/skills/qa-core/scripts/tests
          python3 -m unittest discover -s plugins/arquitectura/skills/capacity-estimation/scripts -p 'test_*.py'

      - name: Plugins y marketplace válidos para Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
          for p in plugins/*/; do claude plugin validate "$p"; done

      - name: Instalador (Windsurf, Cursor, Codex, Claude) en seco
        run: |
          for t in windsurf cursor codex claude copilot; do ./install.sh --tool "$t" --project-dir "$RUNNER_TEMP/p" --dry-run; done
          HOME="$RUNNER_TEMP/h" ./install.sh --tool windsurf --scope user --plugins qa
          for d in "$RUNNER_TEMP"/h/.codeium/windsurf/skills/*/; do agentskills validate "$d"; done
